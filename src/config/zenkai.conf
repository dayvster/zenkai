# Window dimensions
window_width = 600
window_height = 500

# Main layout — space between window border and inner widgets
layout_margin = 0
# Vertical spacing between search bar and list
layout_spacing = 0

# Icon size for app list items
icon_size = 32

# Theme: pass via --theme CLI flag (e.g. --theme=minimal)
# Built-in themes: dark, light, dracula, ayu-dark, minimal

# Close launcher when it loses focus (e.g. clicking outside)
close_on_focus_out = false

# Show a transparent backdrop covering the full screen to catch clicks outside
show_backdrop = false

# Clipboard command for plugin ExecCmd results (e.g. xclip -selection c)
clipboard = ""

# URL handler command for plugin open_url results (e.g. xdg-open, firefox)
url_handler = "xdg-open"

# Animations
no_animations = false
animation_interval = 200
# Easing: linear, in-quad, out-quad, in-out-quad, in-cubic, out-cubic,
#         in-out-cubic, out-back, in-out-back
animation_easing = "out-cubic"

# -- Bottom bar (action buttons bar) ------------------------------------------
bottom_bar_margin_top = 4
bottom_bar_margin_bottom = 4
bottom_bar_margin_left = 8
bottom_bar_margin_right = 8
bottom_bar_spacing = 4
